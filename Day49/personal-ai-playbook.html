<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal AI Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --ink:#0F1320; --panel:#171B2C; --panel-2:#1F2438; --panel-3:#262C46;
  --line:#2A3050; --text:#E8EAF5; --text-muted:#8890B5;
  --accent:#5EEAD4; --accent-ink:#04302B; --accent-2:#FFB454; --accent-3:#A78BFA; --danger:#FB7185; --danger-ink:#3D0F17;
  --radius:12px; --radius-sm:8px;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --ink:#F5F6FA; --panel:#FFFFFF; --panel-2:#EEF0F8; --panel-3:#E4E7F5;
  --line:#DCE0F0; --text:#1B1E2E; --text-muted:#5B6180;
  --accent:#0D9488; --accent-ink:#E4FBF7; --accent-2:#B45309; --accent-3:#7C3AED; --danger:#DC2626; --danger-ink:#FEE2E2;
  --shadow:0 8px 30px rgba(30,35,70,.08);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--font-body);transition:background .25s,color .25s;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:var(--font-body);cursor:pointer;}
::selection{background:var(--accent);color:var(--accent-ink);}
a{color:var(--accent);}
code,.mono{font-family:var(--font-mono);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

/* ================= LAYOUT ================= */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-3));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:15px;flex-shrink:0;}
.brand-text{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.2;}
.brand-text span{display:block;font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--text-muted);}
.nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:18px;}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:10px 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text-muted);font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:background .15s,color .15s;}
.nav-item:hover{background:var(--panel-2);color:var(--text);}
.nav-item.active{background:var(--panel-2);color:var(--accent);}
.nav-item .ic{font-size:16px;width:18px;text-align:center;}
.sidebar-foot{margin-top:auto;font-size:11px;color:var(--text-muted);padding:8px;line-height:1.5;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink);z-index:30;}
.hamburger{display:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);width:36px;height:36px;color:var(--text);font-size:16px;}
.search-wrap{flex:1;max-width:380px;position:relative;}
.search-wrap input{width:100%;padding:9px 12px 9px 34px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:13.5px;}
.search-wrap .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:14px;}
.kbd-hint{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:var(--font-mono);}
.topbar-spacer{flex:1;}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);width:36px;height:36px;color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.btn{border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,transform .1s;}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn-primary:hover{filter:brightness(1.07);border-color:var(--accent);}
.btn-danger{color:var(--danger);border-color:var(--line);}
.btn-danger:hover{border-color:var(--danger);}
.btn-sm{padding:6px 10px;font-size:12px;}

#view{padding:24px 28px 60px;max-width:1180px;width:100%;margin:0 auto;}

/* ================= EXPLAINER BANNER ================= */
.explainer-banner{margin:0 auto 20px;max-width:1180px;padding:0 28px;}
.explainer-inner{background:linear-gradient(135deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;}
.explainer-inner .ic{font-size:20px;flex-shrink:0;}
.explainer-inner h3{font-size:14.5px;margin-bottom:4px;}
.explainer-inner p{font-size:12.8px;color:var(--text-muted);line-height:1.55;}
.explainer-close{margin-left:auto;background:none;border:none;color:var(--text-muted);font-size:16px;flex-shrink:0;}
.explainer-close:hover{color:var(--text);}

/* ================= DASHBOARD ================= */
.hero{position:relative;border:1px solid var(--line);border-radius:16px;padding:34px 28px;margin-bottom:22px;overflow:hidden;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:26px 26px;background-color:var(--panel);background-position:center;
}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(94,234,212,.14),transparent 55%),radial-gradient(circle at 85% 80%,rgba(167,139,250,.12),transparent 50%);}
.hero-content{position:relative;z-index:1;max-width:640px;}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);letter-spacing:.06em;margin-bottom:10px;display:block;}
.hero h1{font-size:30px;line-height:1.15;margin-bottom:10px;}
.hero p{color:var(--text-muted);font-size:14px;line-height:1.6;margin-bottom:18px;}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px;}
.stat-card .num{font-family:var(--font-display);font-size:26px;font-weight:700;}
.stat-card .lbl{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px;flex-wrap:wrap;gap:8px;}
.section-head h2{font-size:17px;}
.section-head .sub{font-size:12.5px;color:var(--text-muted);margin-top:3px;}
.section-head .link{font-size:12.5px;color:var(--accent);background:none;border:none;font-weight:600;}

.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.quick-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;transition:border-color .15s,transform .1s;}
.quick-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.quick-card .ic{font-size:20px;margin-bottom:8px;display:block;}
.quick-card h4{font-size:13.5px;margin-bottom:4px;}
.quick-card p{font-size:11.8px;color:var(--text-muted);line-height:1.45;}

/* ================= CATEGORY TABS / FILTERS ================= */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text-muted);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;}
.chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.chip:hover{border-color:var(--accent);}
.fav-toggle{margin-left:auto;}

/* ================= WORKFLOW CARDS ================= */
.wf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.wf-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .1s;position:relative;}
.wf-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.wf-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.wf-cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-3);font-weight:700;}
.wf-star{background:none;border:none;font-size:16px;color:var(--text-muted);}
.wf-star.on{color:var(--accent-2);}
.wf-title{font-size:14.5px;font-weight:600;line-height:1.3;}
.wf-summary{font-size:12.3px;color:var(--text-muted);line-height:1.5;flex:1;}
.wf-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-muted);}
.wf-actions{display:flex;gap:6px;}
.wf-actions button{background:none;border:none;color:var(--text-muted);font-size:13px;padding:2px 4px;}
.wf-actions button:hover{color:var(--accent);}
.empty-state{border:1px dashed var(--line);border-radius:var(--radius);padding:40px 20px;text-align:center;color:var(--text-muted);}
.empty-state .ic{font-size:26px;margin-bottom:8px;display:block;}
.empty-state h3{font-size:14px;color:var(--text);margin-bottom:5px;}
.empty-state p{font-size:12.5px;line-height:1.5;}

/* ================= BUILDER LAYOUT ================= */
.builder-wrap{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:flex-start;}
.builder-picker{position:sticky;top:80px;}
.picker-title{font-size:13px;font-weight:700;margin-bottom:4px;}
.picker-sub{font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.5;}
.pick-card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:8px;}
.pick-card-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.pick-card .ic{font-size:15px;}
.pick-card .lbl{font-size:13px;font-weight:600;flex:1;}
.pick-card .blurb{font-size:11.3px;color:var(--text-muted);line-height:1.45;margin-bottom:8px;}
.pick-card button{width:100%;}
.pick-card.disabled{opacity:.4;}

.assembly{min-width:0;}
.assembly-empty{border:1px dashed var(--line);border-radius:var(--radius);padding:34px 18px;text-align:center;color:var(--text-muted);font-size:13px;line-height:1.6;}
.block-row{position:relative;padding-left:26px;margin-bottom:2px;}
.block-connector{position:absolute;left:9px;top:0;bottom:-2px;width:2px;background:repeating-linear-gradient(var(--line),var(--line) 4px,transparent 4px,transparent 8px);}
.block-node{position:absolute;left:4px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);z-index:2;}
.block-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
.block-card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.block-card .ic{font-size:15px;}
.block-card .lbl{font-size:13.5px;font-weight:700;flex:1;font-family:var(--font-display);}
.block-card .rm{background:none;border:none;color:var(--text-muted);font-size:15px;}
.block-card .rm:hover{color:var(--danger);}
.block-card .blurb{font-size:11.5px;color:var(--text-muted);line-height:1.5;margin-bottom:10px;}
.field{width:100%;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:13px;font-family:var(--font-body);}
textarea.field{resize:vertical;min-height:64px;line-height:1.5;}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;}
.ms-options{display:flex;flex-wrap:wrap;gap:6px;}
.ms-opt{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:11.8px;background:var(--panel-2);color:var(--text-muted);}
.ms-opt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}

.preview-panel{position:sticky;top:80px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:0;}
.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.preview-head h4{font-size:13px;}
.preview-box{background:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;font-family:var(--font-mono);font-size:12px;line-height:1.65;white-space:pre-wrap;max-height:340px;overflow:auto;color:var(--text);}
.preview-box .ph{color:var(--accent-2);}
.preview-actions{display:flex;gap:8px;margin-top:10px;}

/* ================= LEARN ================= */
.learn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.learn-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.learn-card .ic{font-size:18px;margin-bottom:8px;display:block;}
.learn-card h4{font-size:13.8px;margin-bottom:6px;}
.learn-card p{font-size:12.2px;color:var(--text-muted);line-height:1.55;margin-bottom:10px;}
.learn-ex{border-top:1px dashed var(--line);padding-top:9px;font-size:11.5px;}
.learn-ex b{color:var(--text);}
.bad{color:var(--danger);}
.good{color:var(--accent);}

/* ================= SETTINGS ================= */
.settings-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.settings-block h3{font-size:14px;margin-bottom:4px;}
.settings-block .sub{font-size:12px;color:var(--text-muted);margin-bottom:14px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.kv-list{display:grid;grid-template-columns:max-content 1fr;gap:8px 14px;font-size:12.5px;}
.kv-list .k{font-family:var(--font-mono);color:var(--accent);}
.kv-list .v{color:var(--text-muted);}
.toggle{position:relative;width:44px;height:24px;border-radius:999px;background:var(--panel-3);border:1px solid var(--line);flex-shrink:0;}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-muted);transition:left .15s,background .15s;}
.toggle.on{background:var(--accent);}
.toggle.on::after{left:22px;background:var(--accent-ink);}

/* ================= MODAL ================= */
.modal-backdrop{position:fixed;inset:0;background:rgba(5,6,15,.6);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow-y:auto;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;box-shadow:var(--shadow);animation:pop .18s ease;}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line);}
.modal-head h2{font-size:18px;}
.modal-head .sub{font-size:12.5px;color:var(--text-muted);margin-top:4px;}
.modal-close{margin-left:auto;background:none;border:none;color:var(--text-muted);font-size:18px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:18px 22px;max-height:62vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);}
.field-label{font-size:12px;font-weight:600;margin-bottom:5px;display:block;}
.field-hint{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.4;}
.form-row{margin-bottom:14px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.var-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.var-row .field{flex:1;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.tag-pill{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:11.5px;display:flex;align-items:center;gap:6px;}
.tag-pill button{background:none;border:none;color:var(--text-muted);font-size:12px;}
.onboard-step{text-align:center;padding:6px 6px 4px;}
.onboard-step .ic{font-size:32px;margin-bottom:12px;}
.onboard-step h3{font-size:16.5px;margin-bottom:8px;}
.onboard-step p{font-size:13px;color:var(--text-muted);line-height:1.6;}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--accent);width:16px;border-radius:4px;}

/* ================= TOAST ================= */
.toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--panel-3);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:999px;font-size:12.8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;animation:toastIn .18s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ================= RESPONSIVE ================= */
@media (max-width:980px){
  .builder-wrap{grid-template-columns:1fr;}
  .builder-picker,.preview-panel{position:static;}
  .stat-grid,.quick-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:flex;align-items:center;justify-content:center;}
  #view{padding:18px 16px 50px;}
  .explainer-banner{padding:0 16px;}
  .hero{padding:24px 18px;}
  .hero h1{font-size:24px;}
  .two-col{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div class="brand-text">Playbook<span>Personal AI system</span></div>
    </div>
    <div class="nav-group">
      <button class="nav-item" data-nav="dashboard"><span class="ic">🏠</span>Dashboard</button>
      <button class="nav-item" data-nav="workflows"><span class="ic">🗂️</span>Workflows</button>
      <button class="nav-item" data-nav="promptbuilder"><span class="ic">🧱</span>Prompt Builder</button>
      <button class="nav-item" data-nav="loopbuilder"><span class="ic">🔁</span>Loop Builder</button>
      <button class="nav-item" data-nav="learn"><span class="ic">📘</span>Learn</button>
      <button class="nav-item" data-nav="settings"><span class="ic">⚙️</span>Settings</button>
    </div>
    <div class="sidebar-foot">Everything here is saved in your browser only (local storage). Nothing is uploaded anywhere.</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">☰</button>
      <div class="search-wrap">
        <span class="sic">🔍</span>
        <input id="searchInput" type="text" placeholder="Search workflows…">
        <span class="kbd-hint">/</span>
      </div>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" id="helpBtn" title="What is this?">?</button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
      <button class="btn btn-primary" id="newWfBtn">+ New workflow</button>
    </header>

    <div class="explainer-banner" id="explainerBanner"></div>
    <main id="view"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script>
window.addEventListener('error', function(e){
  var box = document.getElementById('fatalErrorBox');
  if(!box){
    box = document.createElement('div');
    box.id='fatalErrorBox';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const root=document.getElementById('toastRoot');

  root.appendChild(t); setTimeout(()=>t.remove(),2400);
}
function copyText(str){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(str).then(()=>toast('Copied to clipboard')).catch(()=>fallbackCopy(str)); }
  else fallbackCopy(str);
}
function fallbackCopy(str){
  const ta=document.createElement('textarea'); ta.value=str; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Copied to clipboard'); }catch(e){ toast('Copy failed — select manually'); }
  ta.remove();
}
function renderTemplate(tpl, vars, varsDef){
  return tpl.replace(/\{\{(\w+)\}\}/g,(m,key)=>{
    const v=vars[key];
    if(v && String(v).trim()) return v;
    const def=(varsDef||[]).find(d=>d.key===key);
    return '['+(def?def.label:key)+']';
  });
}
function renderTemplateHTML(tpl, vars, varsDef){
  return esc(tpl).replace(/\{\{(\w+)\}\}/g,(m,key)=>{
    const v=vars[key];
    if(v && String(v).trim()) return esc(v);
    const def=(varsDef||[]).find(d=>d.key===key);
    return '<span class="ph">['+esc(def?def.label:key)+']</span>';
  });
}

function renderAssembly(kind){
  const blocks = kind==='prompt'? PROMPT_BLOCKS : LOOP_BLOCKS;
  const order = kind==='prompt'? state.builderBlocks : state.loopBlocks;
  const values = kind==='prompt'? state.builderValues : state.loopValues;
  if(!order.length) return `<div class="assembly-empty">No blocks added yet.<br>Pick a block from the left to start assembling your prompt.</div>`;
  return order.map((key,i)=>{
    const b = blocks.find(x=>x.key===key); if(!b) return '';
    return `<div class="block-row">
      ${i<order.length? `<div class="block-connector"></div>`:''}
      <div class="block-node"></div>
      <div class="block-card">
        <div class="block-card-top"><span class="ic">${b.icon}</span><span class="lbl">${esc(b.label)}</span><button class="rm" data-rm-block="${b.key}" data-kind="${kind}" title="Remove block">✕</button></div>
        <div class="blurb">${esc(b.blurb)}</div>
        ${fieldHTML(b, values[key], kind)}
      </div>
    </div>`;
  }).join('');
}

function fieldHTML(b, val, kind){
  val = val||'';
  const dataAttrs = `data-field="${b.key}" data-kind="${kind}"`;
  if(b.type==='textarea'){
    return `<textarea class="field" ${dataAttrs} placeholder="${esc(b.placeholder||'')}" rows="3">${esc(val)}</textarea>`;
  }
  if(b.type==='select'){
    const opts = b.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('');
    let html = `<select class="field" ${dataAttrs}><option value="">Choose…</option>${opts}</select>`;
    if(b.custom && val==='Custom…'){
      html += `<textarea class="field" style="margin-top:8px;" data-field="${b.key}_custom" data-kind="${kind}" placeholder="Type your custom role…"></textarea>`;
    }
    return html;
  }
  if(b.type==='multiselect'){
    const chosen = (val||'').split('||').filter(Boolean);
    return `<div class="ms-options">${b.options.map(o=>`<button type="button" class="ms-opt ${chosen.includes(o)?'on':''}" data-ms="${b.key}" data-kind="${kind}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  }
  return `<input class="field" ${dataAttrs} value="${esc(val)}">`;
}

function assemblePromptText(){
  const lines=[];
  const map={role:'Role',objective:'Objective',context:'Context',constraints:'Constraints',reasoning:'Reasoning strategy',format:'Output format',tone:'Tone',examples:'Examples',quality:'Quality checks'};
  PROMPT_BLOCKS.forEach(b=>{
    if(!state.builderBlocks.includes(b.key)) return;
    let v = state.builderValues[b.key]||'';
    if(b.custom && v==='Custom…') v = state.builderValues[b.key+'_custom']||'';
    if(!v) return;
    lines.push(`${map[b.key]}: ${v}`);
  });
  return lines.length? lines.join('\n\n') : '';
}
function assembledPromptHTML(){
  const txt = assemblePromptText();
  return txt? esc(txt) : `<span class="ph">Add and fill in blocks on the left to build your prompt…</span>`;
}

function openOnboarding(){
  const steps=[
    {ic:'🧠',title:'Welcome to your AI Playbook',body:'A personal system for reusing your best prompts instead of rewriting them from scratch every time.'},
    {ic:'🗂️',title:'Workflows are ready-made',body:'Ten workflows are already saved for your daily build routine — interview, build, README, caption, and more.'},

    {ic:'🔁',title:'Make prompts self-improving',body:'The Loop Builder turns any prompt into one that checks and revises its own output automatically.'}

    const s=steps[idx];
    openModal(`
      <div class="modal-body" style="max-height:none;">

          <div class="ic">${s.ic}</div>
          <h3>${esc(s.title)}</h3>

        <button class="btn btn-primary" id="obNext">${idx===steps.length-1?'Start exploring':'Next'}</button>

    openModal(`

function openWorkflowEditor(id){
  const isNew = !id;
  const w = isNew? {id:uid(),title:'',category:CATEGORIES[0],summary:'',template:'',variables:[],tips:[],favorite:false,isDefault:false,createdAt:Date.now()} : Object.assign({},state.workflows.find(x=>x.id===id));
  let localVars = (w.variables||[]).slice();
  function draw(){
    openModal(`
      <div class="modal-head"><div><h2>${isNew?'New workflow':'Edit workflow'}</h2><div class="sub">Variables use {{this_format}} inside the template.</div></div><button class="modal-close">✕</button></div>
      <div class="modal-body">
        <div class="form-row"><span class="field-label">Title</span><input class="field" id="fTitle" value="${esc(w.title)}" placeholder="e.g. Weekly LinkedIn Recap"></div>
        <div class="two-col form-row">
          <div><span class="field-label">Category</span><select class="field" id="fCategory">${CATEGORIES.map(c=>`<option ${w.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
          <div><span class="field-label">Favorite</span><button type="button" class="toggle ${w.favorite?'on':''}" id="fFav" style="margin-top:6px;"></button></div>
        </div>
        <div class="form-row"><span class="field-label">Summary</span><textarea class="field" id="fSummary" rows="2" placeholder="One line describing what this does">${esc(w.summary)}</textarea></div>
        <div class="form-row"><span class="field-label">Template</span><textarea class="field mono" id="fTemplate" rows="7" placeholder="Write your prompt. Use {{variable_key}} for fill-in fields.">${esc(w.template)}</textarea>
          <div class="field-hint">Example: "Write a caption for {{app_name}} about {{key_learning}}."</div>
        </div>
        <div class="form-row">
          <span class="field-label">Variables</span>
          <div id="varsList">${localVars.map((v,i)=>varRow(v,i)).join('')}</div>
          <button class="btn btn-sm" id="addVarBtn" type="button">+ Add variable</button>
        </div>
      </div>
      <div class="modal-foot"><button class="btn modal-close">Cancel</button><button class="btn btn-primary" id="saveWfBtn">Save workflow</button></div>`);

    document.getElementById('fFav').onclick=(e)=>{ e.target.classList.toggle('on'); };
    document.getElementById('addVarBtn').onclick=()=>{ localVars.push({key:'field'+(localVars.length+1),label:'',placeholder:''}); draw(); };
    document.querySelectorAll('[data-rm-var]').forEach(b=>b.onclick=()=>{ localVars.splice(+b.dataset.rmVar,1); draw(); });
    document.getElementById('saveWfBtn').onclick=()=>{
      const finalVars = [];
      document.querySelectorAll('.var-row').forEach(row=>{
        const key=row.querySelector('[data-vkey]').value.trim().replace(/\s+/g,'_');
        const label=row.querySelector('[data-vlabel]').value.trim();
        const ph=row.querySelector('[data-vph]').value.trim();
        if(key && label) finalVars.push({key,label,placeholder:ph});
      });
      const saved = {
        id:w.id, isDefault:w.isDefault, createdAt:w.createdAt, favorite: document.getElementById('fFav').classList.contains('on'),
        title: document.getElementById('fTitle').value.trim()||'Untitled workflow',
        category: document.getElementById('fCategory').value,
        summary: document.getElementById('fSummary').value.trim(),
        template: document.getElementById('fTemplate').value,
        variables: finalVars,
        tips: w.tips||[]
      };
      const idx = state.workflows.findIndex(x=>x.id===w.id);
      if(idx>-1) state.workflows[idx]=saved; else state.workflows.unshift(saved);
      saveWorkflows(); closeModal(); render(); toast('Workflow saved');
    };
  }
  function varRow(v,i){
    return `<div class="var-row">
      <input class="field" data-vkey placeholder="key" value="${esc(v.key)}" style="max-width:110px;">

      <button data-rm-var="${i}" class="icon-btn" type="button" style="width:32px;height:32px;flex-shrink:0;">✕</button>
    </div>`;
  }
  draw();
}

function confirmDelete(id){

  openModal(`
    <div class="modal-head"><div><h2>Delete "${esc(w.title)}"?</h2><div class="sub">This can't be undone.</div></div><button class="modal-close">✕</button></div>
    <div class="modal-foot"><button class="btn modal-close">Cancel</button><button class="btn btn-danger" id="confirmDelBtn">Delete workflow</button></div>`);
  document.getElementById('confirmDelBtn').onclick=()=>{
    state.workflows = state.workflows.filter(x=>x.id!==id); saveWorkflows(); closeModal(); render(); toast('Workflow deleted');
  };
}
function duplicateWorkflow(id){
  const w=state.workflows.find(x=>x.id===id); if(!w) return;
  const copy=Object.assign({},w,{id:uid(),title:w.title+' (copy)',isDefault:false,createdAt:Date.now()});
  state.workflows.unshift(copy); saveWorkflows(); render(); toast('Workflow duplicated');
}

      <div class="form-row"><span class="field-label">Preview</span><div class="preview-box">${esc(templateText)}</div></div>
    </div>
    <div class="modal-foot"><button class="btn modal-close">Cancel</button><button class="btn btn-primary" id="confirmSaveWfBtn">Save</button></div>`);
  document.getElementById('confirmSaveWfBtn').onclick=()=>{
    const title=document.getElementById('saveTitle').value.trim()||'Untitled workflow';
    const category=document.getElementById('saveCategory').value;
    state.workflows.unshift({id:uid(),title,category,summary:'Created from '+ (defaultCat.includes('Loop')?'Loop':'Prompt') +' Builder.',template:templateText,variables:[],tips:[],favorite:false,isDefault:false,createdAt:Date.now()});
    saveWorkflows(); closeModal(); toast('Saved to Workflows'); navigate('workflows');
  };
}

/* ======================================================================
   EVENT WIRING
   ====================================================================== */
function wireViewEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.nav)));

  // workflows grid
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',(e)=>{ if(e.target.closest('button')) return; openWorkflowDetail(el.dataset.open); }));
  document.querySelectorAll('[data-fav]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); const w=state.workflows.find(x=>x.id===el.dataset.fav); w.favorite=!w.favorite; saveWorkflows(); render(); }));
  document.querySelectorAll('[data-dup]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); duplicateWorkflow(el.dataset.dup); }));
  document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); confirmDelete(el.dataset.del); }));

  // filters
  document.querySelectorAll('[data-cat]').forEach(el=>el.addEventListener('click',()=>{ state.filter.category=el.dataset.cat; render(); }));
  const favChip=document.getElementById('favToggleChip'); if(favChip) favChip.onclick=()=>{ state.filter.favOnly=!state.filter.favOnly; render(); };

  // prompt builder
  document.querySelectorAll('[data-add-block]').forEach(el=>el.addEventListener('click',()=>{ state.builderBlocks.push(el.dataset.addBlock); rerenderBuilder('prompt'); }));
  const clearP=document.getElementById('clearPromptBlocks'); if(clearP) clearP.onclick=()=>{ state.builderBlocks=[]; state.builderValues={}; rerenderBuilder('prompt'); };
  const copyPBtn=document.getElementById('copyPromptBtn'); if(copyPBtn) copyPBtn.onclick=()=>copyText(assemblePromptText());
  const saveAsWf=document.getElementById('saveAsWfBtn'); if(saveAsWf) saveAsWf.onclick=()=>openSaveAsWorkflow(assemblePromptText(), CATEGORIES[3]);

  // loop builder
  const loopBaseInput=document.getElementById('loopBaseInput');
  if(loopBaseInput) loopBaseInput.oninput=()=>{ state.loopBase=loopBaseInput.value; document.getElementById('loopPreview').innerHTML=assembledLoopHTML(); };
  document.querySelectorAll('[data-add-loop]').forEach(el=>el.addEventListener('click',()=>{ state.loopBlocks.push(el.dataset.addLoop); rerenderBuilder('loop'); }));
  const clearL=document.getElementById('clearLoopBlocks'); if(clearL) clearL.onclick=()=>{ state.loopBlocks=[]; state.loopValues={}; rerenderBuilder('loop'); };
  const copyLBtn=document.getElementById('copyLoopBtn'); if(copyLBtn) copyLBtn.onclick=()=>copyText(assembleLoopText());
  const saveLoopWf=document.getElementById('saveLoopAsWfBtn'); if(saveLoopWf) saveLoopWf.onclick=()=>openSaveAsWorkflow(assembleLoopText(), CATEGORIES[2]);

  wireBlockFields();

  // settings
  const themeToggle=document.getElementById('themeToggleSettings'); if(themeToggle) themeToggle.onclick=toggleTheme;
  const exportBtn=document.getElementById('exportBtn'); if(exportBtn) exportBtn.onclick=exportData;
  const importFile=document.getElementById('importFile'); if(importFile) importFile.onchange=importData;
  const resetBtn=document.getElementById('resetBtn'); if(resetBtn) resetBtn.onclick=resetDefaults;
  const reopenHelp=document.getElementById('reopenHelpBtn'); if(reopenHelp) reopenHelp.onclick=openHelpModal;

  const search=document.getElementById('searchInput');
  search.value=state.filter.search;
  search.oninput=()=>{ state.filter.search=search.value; if(state.view!=='workflows') navigate('workflows'); else { document.querySelector('#view').innerHTML=viewWorkflows(); wireViewEvents(); search.focus(); } };
}

function wireBlockFields(){
  document.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('input',()=>{
      const store = el.dataset.kind==='prompt'? state.builderValues : state.loopValues;
      store[el.dataset.field]=el.value;
      updatePreview(el.dataset.kind);
      if(el.tagName==='SELECT') rerenderBuilder(el.dataset.kind);
    });
  });
  document.querySelectorAll('[data-rm-block]').forEach(el=>el.addEventListener('click',()=>{
    state.builderBlocks = state.builderBlocks.filter(k=>k!==el.dataset.rmBlock); rerenderBuilder('prompt');
  }));
  document.querySelectorAll('[data-rm-block][data-kind="loop"]').forEach(()=>{});
  document.querySelectorAll('.block-card .rm').forEach(el=>{
    if(el.dataset.kind==='loop'){ el.onclick=()=>{ state.loopBlocks=state.loopBlocks.filter(k=>k!==el.dataset.rmBlock); rerenderBuilder('loop'); }; }
  });
  document.querySelectorAll('[data-ms]').forEach(el=>el.addEventListener('click',()=>{
    const store = el.dataset.kind==='prompt'? state.builderValues : state.loopValues;
    const key=el.dataset.ms, val=el.dataset.val;
    let chosen=(store[key]||'').split('||').filter(Boolean);
    if(chosen.includes(val)) chosen=chosen.filter(v=>v!==val); else chosen.push(val);
    store[key]=chosen.join('||');
    rerenderBuilder(el.dataset.kind);
  }));
}

function rerenderBuilder(kind){
  if(kind==='prompt'){
    document.getElementById('assemblyList').innerHTML=renderAssembly('prompt');
    const picker=document.querySelector('.builder-picker'); if(picker){ document.querySelector('#view').innerHTML=viewPromptBuilder(); wireViewEvents(); }
  } else {
    document.querySelector('#view').innerHTML=viewLoopBuilder(); wireViewEvents();
  }
}
function updatePreview(kind){
  if(kind==='prompt'){ const p=document.getElementById('promptPreview'); if(p) p.innerHTML=assembledPromptHTML(); }
  else { const p=document.getElementById('loopPreview'); if(p) p.innerHTML=assembledLoopHTML(); }
}

/* ======================================================================
   SETTINGS ACTIONS
   ====================================================================== */
function toggleTheme(){
  state.settings.theme = state.settings.theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme', state.settings.theme);
  saveSettings(state.settings);
  document.getElementById('themeBtn').textContent = state.settings.theme==='dark'?'🌙':'☀️';
  render();
}
function exportData(){
  const blob=new Blob([JSON.stringify({workflows:state.workflows, exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='personal-ai-playbook-export.json'; a.click();
  URL.revokeObjectURL(url); toast('Exported');
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(Array.isArray(data.workflows)){
        state.workflows = data.workflows.concat(state.workflows.filter(w=>!data.workflows.some(d=>d.id===w.id)));
        saveWorkflows(); render(); toast('Imported '+data.workflows.length+' workflows');
      } else toast('That file doesn\'t look like a valid export');
    }catch(err){ toast('Import failed — invalid JSON'); }
  };
  reader.readAsText(file);
}
function resetDefaults(){
  openModal(`
    <div class="modal-head"><div><h2>Reset to defaults?</h2><div class="sub">This replaces all workflows with the original starter set. Custom workflows will be lost.</div></div><button class="modal-close">✕</button></div>
    <div class="modal-foot"><button class="btn modal-close">Cancel</button><button class="btn btn-danger" id="confirmResetBtn">Reset</button></div>`);
  document.getElementById('confirmResetBtn').onclick=()=>{
    state.workflows = DEFAULT_WORKFLOWS.map(w=>Object.assign({},w,{id:uid()}));
    saveWorkflows(); closeModal(); navigate('workflows'); toast('Restored defaults');
  };
}

/* ======================================================================
   GLOBAL WIRING
   ====================================================================== */
document.getElementById('hamburgerBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('helpBtn').onclick=openHelpModal;
document.getElementById('themeBtn').textContent = state.settings.theme==='dark'?'🌙':'☀️';
document.getElementById('themeBtn').onclick=toggleTheme;
document.getElementById('newWfBtn').onclick=()=>openWorkflowEditor(null);

document.addEventListener('keydown',(e)=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing = tag==='input'||tag==='textarea'||tag==='select';
  if(e.key==='Escape'){ closeModal(); return; }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); navigate('workflows'); setTimeout(()=>document.getElementById('searchInput').focus(),0); }
  else if(e.key==='n' || e.key==='N'){ openWorkflowEditor(null); }
  else if(e.key==='?'){ openHelpModal(); }
});

/* init */
render();
if(!state.settings.onboarded){ setTimeout(openOnboarding, 300); }
})();
</script>
</body>
</html>
