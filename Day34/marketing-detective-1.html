<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketing Detective — Case Files</title>
<style>
  :root{
    --bg-deep:#12100d;
    --wood:#2b2118;
    --wood-dark:#1c1610;
    --cork:#4a3a29;
    --cork-dot:#5c4a35;
    --paper:#f1e7d2;
    --paper-2:#e9dcbf;
    --ink:#2a2118;
    --ink-soft:#5a4a3a;
    --accent:#d97757;
    --accent-bright:#ff9d73;
    --accent-dim:#8a5138;
    --muted:#b8a894;
    --danger:#c0503f;
    --success:#7a9a6a;
    --gold:#c9a463;
    --shadow-deep: 0 20px 50px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: radial-gradient(ellipse at top, #1a140f 0%, #0c0a08 70%);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--paper);
    overflow-x:hidden;
    min-height:100vh;
  }
  #root{min-height:100vh; display:flex; flex-direction:column;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--wood-dark);}
  ::-webkit-scrollbar-thumb{background:var(--cork-dot); border-radius:6px;}

  .mono{ font-family:'Courier New', Courier, monospace; }

  .corkboard{
    background-color: var(--cork);
    background-image:
      radial-gradient(var(--cork-dot) 1.2px, transparent 1.4px),
      radial-gradient(var(--cork-dot) 1px, transparent 1.2px);
    background-size: 26px 26px, 18px 18px;
    background-position: 0 0, 9px 9px;
    position: relative;
    flex:1;
    padding: 24px 18px 60px;
  }
  .corkboard::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 30% 0%, rgba(255,180,120,0.05), transparent 55%),
                radial-gradient(ellipse at 80% 100%, rgba(0,0,0,0.35), transparent 60%);
    pointer-events:none;
  }

  .topbar{
    background: linear-gradient(180deg, #1c1610, #14100c);
    border-bottom: 2px solid #000;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    padding: 14px 22px;
    display:flex; align-items:center; justify-content:space-between;
    position: sticky; top:0; z-index:50;
  }
  .brand{ display:flex; align-items:center; gap:10px; letter-spacing: 2px; }
  .brand .badge{
    width:38px;height:38px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-bright), var(--accent-dim) 70%);
    display:flex;align-items:center;justify-content:center;
    box-shadow: 0 0 14px rgba(217,119,87,0.55), inset 0 0 6px rgba(0,0,0,0.4);
    font-weight:bold; color:#1c1610; font-family: Georgia, serif;
  }
  .brand h1{ font-size: 18px; margin:0; font-weight:700; color:var(--paper); text-transform:uppercase; }
  .brand small{ display:block; color:var(--muted); font-size:11px; letter-spacing:3px; margin-top:2px;}

  .steps{ display:flex; gap:10px; align-items:center; }
  .step-dot{ width:11px;height:11px;border-radius:50%; background: #3a2f24; border:1px solid #55452f; transition: all .4s ease; }
  .step-dot.active{ background: var(--accent); box-shadow: 0 0 10px var(--accent-bright); border-color:var(--accent-bright); }
  .step-dot.done{ background: var(--gold); border-color: var(--gold); }

  .folder-tab{
    display:inline-block; background: linear-gradient(180deg, #d8b979, #c19a55); color:#3a2b16;
    padding:6px 18px; border-radius: 6px 6px 0 0; font-family:'Courier New', monospace;
    font-size:12px; letter-spacing:2px; font-weight:bold; box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
  }

  .btn{
    font-family: Georgia, serif;
    background: linear-gradient(180deg, var(--accent-bright), var(--accent-dim));
    color: #201209; border:none; padding: 13px 30px; border-radius: 4px; font-size:15px; font-weight:700;
    letter-spacing:1px; cursor:pointer;
    box-shadow: 0 6px 0 #6f3d29, 0 10px 18px rgba(0,0,0,0.4);
    transition: transform .12s ease, box-shadow .12s ease; text-transform: uppercase;
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 8px 0 #6f3d29, 0 14px 22px rgba(0,0,0,0.45); }
  .btn:active{ transform: translateY(3px); box-shadow: 0 3px 0 #6f3d29; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }

  .paper-card{
    background: var(--paper); color: var(--ink); border-radius: 2px;
    box-shadow: 0 10px 22px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.05) inset;
    position:relative;
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, transparent 2px, transparent 26px);
  }
  .pin{
    width:16px;height:16px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff8a6b, #a13a24 75%);
    box-shadow: 0 3px 5px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.5);
    position:absolute; top:-9px; left:50%; transform:translateX(-50%); z-index:3;
  }

  .screen-enter{ animation: fadeUp .55s ease both; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
  .glow-text{ color: var(--accent-bright); text-shadow: 0 0 12px rgba(255,157,115,0.5); }

  .intro-wrap{
    flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column;
    text-align:center; padding: 40px 20px;
    background: radial-gradient(ellipse at center, #221a13 0%, #0e0b08 80%);
    position:relative;
  }
  .lamp-glow{
    position:absolute; top:0; left:50%; transform:translateX(-50%); width:600px; height:400px;
    background: radial-gradient(ellipse at top, rgba(255,180,120,0.14), transparent 70%); pointer-events:none;
  }
  .case-drawer{
    width:min(560px, 90vw);
    background: linear-gradient(180deg, #3a2c1e, #221a12);
    border: 1px solid #4a3826; border-radius: 8px; padding: 34px 30px;
    box-shadow: var(--shadow-deep); position:relative;
  }
  .type-cursor::after{ content:'▌'; animation: blink 1s step-start infinite; color: var(--accent-bright); }
  @keyframes blink{ 50%{ opacity:0; } }

  .theme-btn{
    cursor:pointer; padding:8px 14px; border-radius:20px; font-size:12px;
    border: 2px solid #4a3826; background: transparent;
    display:inline-flex; align-items:center; gap:8px; font-family:'Courier New',monospace;
  }
  .theme-btn.active{ border-color: var(--accent-bright); background: rgba(255,255,255,0.06); }
  .theme-dot{ width:10px;height:10px;border-radius:50%; display:inline-block; }

  .overview-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 26px 22px; max-width:1100px; margin: 10px auto 0;
  }
  .index-card{ padding: 18px 18px 16px; transform: rotate(var(--r,0deg)); transition: transform .25s ease, box-shadow .25s ease; min-height: 130px; }
  .index-card:hover{ transform: rotate(0deg) translateY(-4px) scale(1.02); box-shadow: 0 16px 30px rgba(0,0,0,0.55); z-index:5; }
  .index-card h4{
    margin:0 0 8px; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color: var(--accent-dim); font-family:'Courier New',monospace; border-bottom:1px dashed #c9b98f; padding-bottom:6px;
  }
  .index-card p{ margin:0; font-size:14.5px; line-height:1.5; }
  .chip{
    display:inline-block; background:#e4d3a8; border:1px solid #c9b072; color:#4a3820;
    padding:3px 9px; border-radius:20px; font-size:11.5px; margin:3px 4px 0 0; font-family:'Courier New',monospace;
  }

  .evidence-zone{ position:relative; min-height: 560px; max-width:1200px; margin: 0 auto; border: 2px dashed rgba(201,164,99,0.25); border-radius:10px; }
  .evidence-card{ position:absolute; width:230px; cursor: grab; user-select:none; touch-action:none; }
  .evidence-card.dragging{ cursor:grabbing; z-index:50 !important; }
  .evidence-card .flip-inner{
    position:relative; width:100%; min-height:150px; transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.2,.9,.3,1.2);
  }
  .evidence-card.flipped .flip-inner{ transform: rotateY(180deg); }
  .flip-face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:3px; padding:16px; }
  .flip-back{
    background: linear-gradient(160deg, #241b12, #12100d); border: 1px solid #4a3826;
    display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow: 0 10px 22px rgba(0,0,0,0.5);
  }
  .flip-back .q{ font-size:34px; color: var(--accent); text-shadow:0 0 14px rgba(217,119,87,0.6); font-family:'Courier New',monospace; }
  .flip-front{ transform: rotateY(180deg); background: var(--paper); color: var(--ink); box-shadow: 0 10px 22px rgba(0,0,0,0.5); }
  .flip-front h5{ margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color: var(--accent-dim); font-family:'Courier New',monospace; }
  .flip-front .body-text{ font-size:13.5px; line-height:1.5; }
  .flip-front .body-text p{ margin:0 0 8px; }
  .stamp-classified{ font-family:'Courier New',monospace; font-size:10px; letter-spacing:2px; color:var(--muted); margin-top:8px; }

  .clue-badge{
    position:absolute; top:-10px; right:-10px; background: var(--danger); color:#fff; font-size:10px; font-weight:bold;
    width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 6px rgba(0,0,0,0.5); font-family:'Courier New',monospace; z-index:5;
  }

  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .bar-label{ width:64px; font-size:10.5px; font-family:'Courier New',monospace; color:#6b5a44; }
  .bar-track{ flex:1; background:#d9c9a3; border-radius:6px; height:9px; overflow:hidden; }
  .bar-fill{ height:100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); border-radius:6px; width:0%; transition: width 1.1s cubic-bezier(.3,.9,.4,1); }
  .bar-val{ width:44px; text-align:right; font-size:10.5px; font-family:'Courier New',monospace; color:#4a3820; }

  .options-grid{ display:grid; gap:16px; max-width:800px; margin: 22px auto 0; }
  .option-card{
    background: var(--paper); color: var(--ink); padding: 16px 18px; border-radius:4px; cursor:pointer;
    border: 2px solid transparent; box-shadow: 0 6px 14px rgba(0,0,0,0.35); transition: all .2s ease;
    font-size:14.5px; line-height:1.5; display:flex; gap:12px; align-items:flex-start;
  }
  .option-card:hover{ transform: translateX(4px); border-color: var(--accent-dim); }
  .option-card.selected{ border-color: var(--accent); box-shadow: 0 0 0 3px rgba(217,119,87,0.3), 0 8px 18px rgba(0,0,0,0.4); }
  .option-letter{
    font-family:'Courier New',monospace; font-weight:bold; color:var(--accent-dim); width:24px; height:24px;
    border:2px solid var(--accent-dim); border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-size:12px;
  }
  .option-card.selected .option-letter{ background:var(--accent); color:#fff; border-color:var(--accent); }

  .stamp-wrap{ display:flex; align-items:center; justify-content:center; min-height:340px; position:relative; }
  .stamp{
    font-family: Georgia, serif; font-weight:900; letter-spacing:4px; font-size: clamp(30px, 6vw, 62px);
    border: 6px solid currentColor; padding: 14px 34px; border-radius: 10px;
    transform: rotate(-8deg) scale(0.4); opacity:0;
    animation: stampDown .5s .15s cubic-bezier(.2,1.3,.4,1) forwards; text-transform:uppercase;
  }
  .stamp.correct{ color: var(--success); box-shadow: 0 0 30px rgba(122,154,106,0.35) inset; }
  .stamp.wrong{ color: var(--danger); box-shadow: 0 0 30px rgba(192,80,63,0.35) inset; }
  @keyframes stampDown{ 0%{ opacity:0; transform:rotate(-8deg) scale(2.2);} 60%{opacity:1; transform:rotate(-8deg) scale(0.92);} 100%{opacity:1; transform:rotate(-8deg) scale(1);} }

  .report-section{ background: var(--paper); color:var(--ink); border-radius:6px; padding:20px 24px; margin-bottom:18px; box-shadow: 0 10px 24px rgba(0,0,0,0.4); }
  .report-section h3{
    margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:1.5px; color: var(--accent-dim);
    font-family:'Courier New',monospace; border-bottom: 2px solid var(--accent-dim); padding-bottom:8px;
  }
  .improve-item{ display:flex; gap:10px; margin-bottom:10px; align-items:flex-start; font-size:14.5px; line-height:1.5; }
  .improve-num{
    background: var(--accent); color:#fff; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-family:'Courier New',monospace;
    flex-shrink:0; margin-top:1px;
  }
  .score-banner{ text-align:center; padding: 18px; margin-bottom: 20px; border-radius:8px; font-family:'Courier New',monospace; letter-spacing:1px; }
  .score-banner.good{ background: rgba(122,154,106,0.15); border:1px solid var(--success); color:#c9e0bc; }
  .score-banner.bad{ background: rgba(192,80,63,0.15); border:1px solid var(--danger); color:#f0c3ba; }

  .center-col{ max-width: 760px; margin:0 auto; }
  .hint-text{ color: var(--muted); font-size:13px; text-align:center; margin-top:14px; font-family:'Courier New',monospace; letter-spacing:0.5px;}
  h2.section-title{ text-align:center; font-size: clamp(22px,3.4vw,32px); margin: 4px 0 4px; color: var(--paper); letter-spacing:1px; }
  .section-sub{ text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:26px; font-family:'Courier New',monospace;}

  @media (max-width: 640px){
    .evidence-zone{ min-height: 1400px; }
    .evidence-card{ width: 84vw; }
    .brand h1{ font-size:14px; }
    .steps{ display:none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ======================= THEMES ======================= */
var THEMES = {
  claude: { name:"Claude Orange", accent:"#d97757", bright:"#ff9d73", dim:"#8a5138" },
  noir:   { name:"Noir Blue",     accent:"#5f8fd9", bright:"#8fb4ff", dim:"#3a5a8a" },
  crimson:{ name:"Crimson Red",   accent:"#c0503f", bright:"#ff7a63", dim:"#7a2e22" },
  emerald:{ name:"Emerald Green", accent:"#5c9a6a", bright:"#8fd49f", dim:"#2e5c3a" }
};
function applyTheme(key){
  var t = THEMES[key] || THEMES.claude;
  var r = document.documentElement.style;
  r.setProperty('--accent', t.accent);
  r.setProperty('--accent-bright', t.bright);
  r.setProperty('--accent-dim', t.dim);
}

/* ======================= CASE DATA ======================= */
var CASES = [
{
  id:1, company:"GlowBrew Coffee Co.", industry:"DTC Food & Beverage (Coffee Subscription)",
  objective:"Drive 5,000 new monthly subscription sign-ups for a premium single-origin coffee box.",
  audience:"Urban professionals aged 25–40 who value specialty coffee and convenience.",
  channels:["Instagram Ads","Influencer Marketing","Email Newsletter","Google Search Ads"],
  budget:{ "Instagram Ads":45, "Influencer Marketing":30, "Email Newsletter":10, "Google Search Ads":15 },
  metrics:{ reach:"1.8M", ctr:"0.42%", engagement:"3.1%", conversions:"312", sales:"$18,700" },
  comments:[
    "\"Beautiful ads, but I couldn't find a price anywhere before checkout.\"",
    "\"Every influencer said the same three words. Felt scripted.\"",
    "\"I clicked three times before I found where to actually subscribe.\""
  ],
  social:"Instagram posts averaged 40K likes but only 0.4% of viewers tapped the link in bio; Story polls show high interest in 'price' and 'shipping time' questions left unanswered.",
  mistake:"The campaign optimized entirely for reach and aesthetic engagement while neglecting a clear, frictionless conversion path — pricing and CTA were buried.",
  clues:[
    "CTR is extremely low (0.42%) despite massive reach — a sign people saw the ads but weren't compelled or able to act.",
    "Customer comments repeatedly mention confusion about price and difficulty finding the checkout link.",
    "Budget is heavily skewed toward top-of-funnel awareness channels (75% combined) with almost nothing spent on retargeting or landing page optimization."
  ],
  explanation:"GlowBrew built gorgeous top-of-funnel creative and paid influencers to generate buzz, but never fixed the path from 'interested' to 'purchased.' High reach with low CTR and stalled conversions is the classic signature of a broken or hidden conversion funnel — the story was captivating, but the door to buy was hidden.",
  improvements:[
    "Add a persistent, visible price and 'Subscribe Now' CTA on every ad creative and linked landing page.",
    "Run a retargeting sequence for users who engaged but didn't convert, addressing price and shipping FAQs directly.",
    "Simplify the landing page to a single, focused conversion path with one clear action."
  ]
},
{
  id:2, company:"StrideFit Athletic", industry:"Sportswear / DTC Apparel",
  objective:"Launch a new running shoe line and generate 10,000 first-week sales.",
  audience:"Amateur and semi-serious runners aged 18–35 across North America.",
  channels:["TikTok Ads","YouTube Pre-Roll","Retail Partnerships","SMS Marketing"],
  budget:{ "TikTok Ads":50, "YouTube Pre-Roll":20, "Retail Partnerships":20, "SMS Marketing":10 },
  metrics:{ reach:"3.2M", ctr:"1.8%", engagement:"6.4%", conversions:"890", sales:"$71,000" },
  comments:[
    "\"Ordered a size 9, got sent a size 7. Support says it's a 'known issue.'\"",
    "\"Love the shoes when they fit — but the size chart doesn't match reality.\"",
    "\"Returned mine after two tries. Sizing is all over the place.\""
  ],
  social:"TikTok comments are flooded with sizing complaints; the branded hashtag has strong reach but sentiment analysis shows 38% of comments reference fit or sizing issues.",
  mistake:"Strong upper-funnel performance was undermined by a product-fulfillment issue (inconsistent sizing) that the marketing team failed to flag or address before scaling ad spend.",
  clues:[
    "CTR and engagement are healthy, showing the creative and targeting worked well.",
    "Conversion rate relative to reach is far below the sales target, despite good ad performance.",
    "Customer comments consistently and specifically describe sizing inconsistency, not a lack of interest."
  ],
  explanation:"The marketing engine worked exactly as designed — people were persuaded and purchased. But scaling spend before fixing a known sizing defect converted marketing success into returns and refunds, quietly eating into net sales and long-term brand trust.",
  improvements:[
    "Pause scaling spend until the sizing/fulfillment issue is resolved with the product team.",
    "Add a proactive sizing guide and fit quiz to the product page to reduce mismatched orders.",
    "Set up a feedback loop between customer support and marketing so fulfillment issues are caught before ad budgets scale further."
  ]
},
{
  id:3, company:"PixelPlay Games", industry:"Mobile Gaming",
  objective:"Acquire 500,000 installs for a new puzzle game within 30 days.",
  audience:"Casual mobile gamers aged 16–45, primarily on Android.",
  channels:["Facebook Ads","Google UAC","Reddit Ads","App Store Optimization"],
  budget:{ "Facebook Ads":35, "Google UAC":40, "Reddit Ads":10, "App Store Optimization":15 },
  metrics:{ reach:"9.4M", ctr:"2.9%", engagement:"—", conversions:"612,000 installs", sales:"Day-7 retention: 4%" },
  comments:[
    "\"The ad showed a totally different game than what I downloaded.\"",
    "\"Uninstalled in 2 minutes, nothing like the trailer.\"",
    "\"Cute ad, boring actual gameplay. Felt tricked.\""
  ],
  social:"App store reviews spiked with 1-star ratings mentioning 'false advertising'; install numbers beat target by 22% but Day-7 retention (4%) is far below the genre benchmark of 15–20%.",
  mistake:"Ad creative depicted gameplay mechanics that don't exist in the actual app, driving installs through false expectations rather than genuine interest — resulting in installs that immediately churn.",
  clues:[
    "Install volume exceeded target significantly, meaning the ads were highly effective at generating clicks and downloads.",
    "Day-7 retention is drastically below industry benchmark, showing users leave almost immediately after installing.",
    "Reviews and comments explicitly call out a mismatch between advertised gameplay and the real app experience."
  ],
  explanation:"This is a bait-and-switch creative problem, not a targeting or budget problem. The ads over-promised a different gameplay experience to maximize clicks, which inflated install numbers but produced users with zero intent to actually play the real game — a costly form of vanity-metric success.",
  improvements:[
    "Rebuild ad creative using actual in-game footage and mechanics, not stylized or fabricated gameplay.",
    "Introduce an onboarding tutorial that bridges expectations from the ad to real gameplay in the first 30 seconds.",
    "Shift a portion of budget from raw install volume to a retention-optimized bidding strategy."
  ]
},
{
  id:4, company:"Nourish Organics", industry:"Meal Kit Delivery",
  objective:"Grow weekly active subscribers by 20% in one quarter.",
  audience:"Health-conscious families and young professionals in suburban markets.",
  channels:["Direct Mail","Podcast Sponsorships","Facebook Ads","Referral Program"],
  budget:{ "Direct Mail":25, "Podcast Sponsorships":35, "Facebook Ads":30, "Referral Program":10 },
  metrics:{ reach:"2.1M", ctr:"0.9%", engagement:"2.4%", conversions:"1,240", sales:"$96,000" },
  comments:[
    "\"The podcast promo code never worked at checkout.\"",
    "\"Tried three different codes from three episodes, all 'invalid.'\"",
    "\"Gave up after the discount code failed twice.\""
  ],
  social:"Referral program shows near-zero activity despite being live for 10 weeks; customer service tickets show a 60% spike in 'promo code invalid' complaints coinciding with podcast ad flights.",
  mistake:"A technical/process failure — expired or misconfigured promo codes tied to podcast sponsorships — silently blocked conversions from one of the largest budget channels.",
  clues:[
    "Podcast sponsorships received the largest budget share (35%) but conversions from that channel lag behind Facebook Ads.",
    "A sharp, specific spike in support tickets about 'invalid promo code' aligns exactly with podcast ad release dates.",
    "The referral program, which depends on working codes, shows almost no activity despite being active for weeks."
  ],
  explanation:"The campaign strategy and audience targeting were sound, but a broken discount code system quietly sabotaged the largest investment channel. Listeners were persuaded to try Nourish, hit a technical wall at checkout, and abandoned — an operational bug masquerading as a marketing performance issue.",
  improvements:[
    "Implement automated QA testing for every promo code before it goes live in any channel.",
    "Set up real-time alerts for spikes in 'invalid code' support tickets tied to specific campaigns.",
    "Simplify checkout to auto-apply podcast-specific codes via tracked links instead of manual entry."
  ]
},
{
  id:5, company:"UrbanNest Furniture", industry:"DTC Home Furniture",
  objective:"Increase online furniture sales by 15% during the fall season.",
  audience:"First-time apartment renters and young homeowners aged 24–38.",
  channels:["Pinterest Ads","Google Shopping","Email Marketing","Retargeting Display"],
  budget:{ "Pinterest Ads":30, "Google Shopping":30, "Email Marketing":15, "Retargeting Display":25 },
  metrics:{ reach:"1.3M", ctr:"1.1%", engagement:"3.8%", conversions:"430", sales:"$210,000" },
  comments:[
    "\"Add-to-cart was easy, but shipping cost only appeared at the very last step and it doubled my total.\"",
    "\"Felt like a bait and switch when the real price showed up at checkout.\"",
    "\"Abandoned my cart — the surprise shipping fee was too much.\""
  ],
  social:"Cart abandonment rate sits at 78%, well above the furniture e-commerce average of ~60%; retargeting ads are being served to the same abandoned carts repeatedly with no change in messaging.",
  mistake:"Hidden shipping costs revealed only at the final checkout step created sticker shock, driving high cart abandonment that retargeting couldn't fix because it never addressed the actual objection.",

/* ======================= HELPERS ======================= */
function esc(str){
  var d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function pickRandomCase(excludeId){
  var pool = excludeId ? CASES.filter(function(c){ return c.id!==excludeId; }) : CASES;
  return pool[Math.floor(Math.random()*pool.length)];
}
function buildOptions(correctCase){
  var others = shuffle(CASES.filter(function(c){ return c.id!==correctCase.id; })).slice(0,3);
  var options = shuffle([
    { text: correctCase.mistake, correct:true }
  ].concat(others.map(function(c){ return { text:c.mistake, correct:false }; })));
  return options;
}
function metricPct(key, raw){
  var num = parseFloat(String(raw).replace(/[^0-9.]/g,'')) || 0;
  if(key==='ctr') return Math.min(100, num*25);
  if(key==='engagement') return Math.min(100, num*12);
  return Math.min(100, 35 + (num % 60));
}
function chip(text){ return '<span class="chip">'+esc(text)+'</span>'; }

var state = {
  themeKey: 'claude',
  screen: 'intro',
  currentCase: null,
  positions: {},
  flipped: {},
  zCounter: 1,
  options: [],
  selectedOpt: null,
  verdict: null,
  revealedCount: 0
};
var typingTimer = null;

var EVIDENCE_LAYOUT = [
  {x: 20,  y: 20}, {x: 300, y: 60}, {x: 580, y: 10}, {x: 850, y: 70},
  {x: 60,  y: 300}, {x: 350, y: 330}
];
var EVIDENCE_KEYS = ['metrics','comments','social','clue1','clue2','clue3'];

function startNewCase(){
  var c = state.currentCase ? pickRandomCase(state.currentCase.id) : CASES[0];
  state.currentCase = c;
  state.positions = {};
  EVIDENCE_KEYS.forEach(function(k, idx){
    var p = EVIDENCE_LAYOUT[idx % EVIDENCE_LAYOUT.length];
    state.positions[k] = { x: p.x, y: p.y, z: 1 };
  });
  state.flipped = {};
  state.zCounter = 1;
  state.options = buildOptions(c);
  state.selectedOpt = null;
  state.verdict = null;
  state.revealedCount = 0;
  state.screen = 'board';
  render();
}

function stepperHTML(step){
  return STEP_LABELS.map(function(l,i){
    var cls = i < step ? 'done' : (i===step ? 'active' : '');
    return '<div class="step-dot '+cls+'" title="'+l+'"></div>';
  }).join('');
}
function topBarHTML(step){
  return '' +
  '<div class="topbar">' +
    '<div class="brand">' +
      '<div class="badge">MD</div>' +
      '<div><h1>Marketing Detective</h1><small>CASE FILES DIVISION</small></div>' +
    '</div>' +

}

      '<div class="flip-face flip-back"><div class="q">'+icon+'</div><div class="stamp-classified">TAP TO REVEAL</div></div>' +

    '</div>' +
  '</div>';
}

/* ======================= MAIN RENDER + BIND ======================= */
function render(){
  applyTheme(state.themeKey);
  var root = document.getElementById('root');
  if(state.screen === 'intro') root.innerHTML = renderIntro();
  else if(state.screen === 'board') root.innerHTML = renderBoard();
  else if(state.screen === 'investigate') root.innerHTML = renderInvestigate();
  else if(state.screen === 'solve') root.innerHTML = renderSolve();
  else if(state.screen === 'closed') root.innerHTML = renderClosed();
  else if(state.screen === 'report') root.innerHTML = renderReport();
  bindEvents();
}

function bindEvents(){
  if(state.screen === 'intro'){
    document.querySelectorAll('.theme-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.themeKey = btn.getAttribute('data-theme');
        render();
      });
    });
    var startBtn = document.getElementById('startBtn');
    if(startBtn) startBtn.addEventListener('click', startNewCase);
    startTyping();
  }

  if(state.screen === 'board'){
    var toEv = document.getElementById('toEvidenceBtn');
    if(toEv) toEv.addEventListener('click', function(){ state.screen='investigate'; render(); });
  }

  if(state.screen === 'investigate'){
    // animate bars
    document.querySelectorAll('.bar-row').forEach(function(row){
      var pct = row.getAttribute('data-pct');
      var fill = row.querySelector('.bar-fill');
      setTimeout(function(){ fill.style.width = pct + '%'; }, 150);
    });
    document.querySelectorAll('.evidence-card').forEach(function(card){
      bindDrag(card);
    });
    var toSolve = document.getElementById('toSolveBtn');
    if(toSolve) toSolve.addEventListener('click', function(){
      if(state.revealedCount >= 6){ state.screen='solve'; render(); }
    });
  }

  if(state.screen === 'solve'){
    document.querySelectorAll('.option-card').forEach(function(card){
      card.addEventListener('click', function(){
        state.selectedOpt = parseInt(card.getAttribute('data-idx'),10);
        render();
      });
    });
    var closeBtn = document.getElementById('closeCaseBtn');
    if(closeBtn) closeBtn.addEventListener('click', function(){
      if(state.selectedOpt===null) return;
      var correct = state.options[state.selectedOpt].correct;
      state.verdict = correct ? 'correct' : 'wrong';
      state.screen = 'closed';
      render();
    });
  }

  if(state.screen === 'closed'){
    var toReport = document.getElementById('toReportBtn');
    if(toReport) toReport.addEventListener('click', function(){ state.screen='report'; render(); });
  }

  if(state.screen === 'report'){
    var newCaseBtn = document.getElementById('newCaseBtn');
    if(newCaseBtn) newCaseBtn.addEventListener('click', startNewCase);
  }
}

function startTyping(){
  var line = "Open a new file to begin the investigation...";
  var el = document.getElementById('typedLine');
  if(!el) return;
  if(typingTimer) clearInterval(typingTimer);
  var i = 0;
  el.textContent = '';
  typingTimer = setInterval(function(){
    i++;
    el.textContent = line.slice(0,i);
    if(i>=line.length) clearInterval(typingTimer);
  }, 32);
}

/* ---------------- Drag + flip-to-reveal ---------------- */
function bindDrag(card){
  var id = card.getAttribute('data-id');
  var dragging = false;
  var moved = false;
  var startX=0, startY=0, origX=0, origY=0;

  function pointerDown(e){
    dragging = true;
    moved = false;
    var pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    origX = state.positions[id].x; origY = state.positions[id].y;
    state.zCounter += 1;
    state.positions[id].z = state.zCounter;
    card.style.zIndex = state.zCounter;
    card.classList.add('dragging');
    document.addEventListener('mousemove', pointerMove);
    document.addEventListener('mouseup', pointerUp);
    document.addEventListener('touchmove', pointerMove, {passive:false});
    document.addEventListener('touchend', pointerUp);
    e.preventDefault && e.preventDefault();
  }
  function pointerMove(e){
    if(!dragging) return;
    e.preventDefault && e.preventDefault();
    var pt = e.touches ? e.touches[0] : e;
    var dx = pt.clientX - startX;
    var dy = pt.clientY - startY;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    var nx = origX + dx, ny = origY + dy;
    state.positions[id].x = nx;
    state.positions[id].y = ny;
    card.style.left = nx + 'px';
    card.style.top = ny + 'px';
  }
  function pointerUp(){
    dragging = false;
    card.classList.remove('dragging');
    document.removeEventListener('mousemove', pointerMove);
    document.removeEventListener('mouseup', pointerUp);
    document.removeEventListener('touchmove', pointerMove);
    document.removeEventListener('touchend', pointerUp);
    if(!moved){
      var wasFlipped = !!state.flipped[id];
      state.flipped[id] = !wasFlipped;
      if(!wasFlipped) state.revealedCount += 1;
      card.classList.toggle('flipped', state.flipped[id]);
      var counterEl = document.getElementById('revealCounter');
      if(counterEl){
        counterEl.textContent = "Drag evidence to rearrange the board. Tap each card to reveal what's inside. (" + state.revealedCount + "/6 revealed)";
      }
      var solveBtn = document.getElementById('toSolveBtn');
      if(solveBtn){
        if(state.revealedCount >= 6){
          solveBtn.removeAttribute('disabled');
          solveBtn.textContent = "I'm Ready to Solve the Case →";
        } else {
          solveBtn.textContent = 'Reveal all evidence to continue (' + state.revealedCount + '/6)';
        }
      }
    }
  }
  card.addEventListener('mousedown', pointerDown);
  card.addEventListener('touchstart', pointerDown, {passive:false});
}

/* ======================= INIT ======================= */
applyTheme(state.themeKey);
render();
</script>
